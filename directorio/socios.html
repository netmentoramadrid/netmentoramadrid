<script>
  let entidadesSocios = []; 
  let personasPlanas = [];  
  
  const inputBuscador = document.getElementById('buscador-texto');
  const selectSector = document.getElementById('filtro-sector');
  const selectRol = document.getElementById('filtro-rol');
  const contenedorSocios = document.getElementById('grid-socios');

  const extraerArray = (raw) => {
      if (!raw) return [];
      if (typeof raw === 'object' && !Array.isArray(raw) && raw.Value) return [raw.Value];
      const arr = Array.isArray(raw) ? raw : [raw];
      return arr.map(item => (typeof item === 'object' && item !== null && item.Value) ? item.Value : item).filter(Boolean);
  };

  async function cargarDatos() {
    try {
      const respuesta = await fetch('./directorio.json');
      if (!respuesta.ok) throw new Error("Base de datos no encontrada.");
      procesarDatos(await respuesta.json());
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('contenido-directorio').classList.remove('hidden');
    } catch (error) {
      document.getElementById('loading').innerHTML = `<p style="color:red; text-align:center;">Error al cargar la base de datos de socios.</p>`;
    }
  }

  function procesarDatos(data) {
      const dbSectores = new Set();
      const dbRoles = new Set();

      const rawEmpresasSocias = data.filter(d => d.tipo === 'empresa_socia');
      const rawPersonasSocias = data.filter(d => d.tipo === 'socio');
      const rawPersonasEmprendedoras = data.filter(d => d.tipo === 'emprendedor');

      rawPersonasSocias.forEach(socio => {
          socio.isAlumni = rawPersonasEmprendedoras.some(emp => 
              (emp.nombre || '').toLowerCase().trim() === (socio.nombre || '').toLowerCase().trim() &&
              (emp.empresaVinculada || '').toLowerCase().trim() === (socio.empresaVinculada || '').toLowerCase().trim()
          );
      });

      // 1. Matriz AGRUPADA (Vista Corporativa)
      entidadesSocios = rawEmpresasSocias.map(emp => {
          if(emp.sector) dbSectores.add(emp.sector.trim());
          const miembros = rawPersonasSocias.filter(p => (p.empresaVinculada || '').toLowerCase().trim() === (emp.nombre || '').toLowerCase().trim());
          miembros.forEach(m => { extraerArray(m.roles).forEach(r => dbRoles.add(r.trim())); });
          
          return {
              id_entidad: 'soc_emp_' + emp.id.toString(),
              is_empresa: true,
              nombre: emp.nombre,
              sector: emp.sector,
              logo: emp.logo,
              web: emp.web,
              miembros: miembros
          };
      });

      const personasAsignadas = entidadesSocios.flatMap(e => e.miembros.map(m => m.id.toString()));
      const personasFisicas = rawPersonasSocias.filter(p => !personasAsignadas.includes(p.id.toString()));
      
      personasFisicas.forEach(pf => {
          extraerArray(pf.roles).forEach(r => dbRoles.add(r.trim()));
          entidadesSocios.push({
              id_entidad: 'soc_fis_' + pf.id.toString(),
              is_empresa: false,
              nombre: pf.nombre,
              sector: '', 
              foto: pf.foto,
              web: '', 
              miembros: [pf]
          });
      });

      // 2. Matriz PLANA (Vista Individual para filtro de Roles)
      personasPlanas = rawPersonasSocias.map(p => {
          // Buscamos la empresa del socio para arrastrar el logo y la web
          const emp = rawEmpresasSocias.find(e => (e.nombre||'').toLowerCase().trim() === (p.empresaVinculada||'').toLowerCase().trim());
          return {
              ...p,
              empresaSector: emp ? emp.sector : '',
              empresaWeb: emp ? emp.web : '',
              empresaLogo: emp ? emp.logo : ''
          };
      });

      [...dbSectores].sort().forEach(s => selectSector.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));
      [...dbRoles].sort().forEach(r => selectRol.insertAdjacentHTML('beforeend', `<option value="${r}">${r}</option>`));

      renderizarInterfaces();
  }

  function renderizarInterfaces() {
      const texto = inputBuscador.value.toLowerCase().trim();
      const sector = selectSector.value;
      const rol = selectRol.value;

      if (rol !== 'todos') {
          // ==========================================
          // MODO INDIVIDUAL: El usuario filtró por Rol
          // ==========================================
          const personasFiltradas = personasPlanas.filter(p => {
              const matchRol = extraerArray(p.roles).includes(rol);
              if (!matchRol) return false;
              
              const matchSector = sector === 'todos' || p.empresaSector === sector;
              if (!matchSector && p.empresaVinculada) return false; 
              
              if (texto !== '') {
                  const strBusqueda = `${p.nombre} ${p.cargo||''} ${p.cargoInterno||''} ${p.empresaVinculada||''} ${extraerArray(p.roles).join(' ')}`.toLowerCase();
                  if (!strBusqueda.includes(texto)) return false;
              }
              return true;
          });
          pintarGridPersonas(personasFiltradas);
      } else {
          // ==========================================
          // MODO CORPORATIVO: Vista agrupada por defecto
          // ==========================================
          const entidadesFiltradas = [];
          entidadesSocios.forEach(entidad => {
              if (sector !== 'todos' && entidad.sector !== sector && entidad.is_empresa) return;

              if (texto !== '') {
                  const matchEmpresa = `${entidad.nombre} ${entidad.sector || ''}`.toLowerCase().includes(texto);
                  const miembrosMatch = entidad.miembros.filter(m => 
                      `${m.nombre} ${m.cargo || ''} ${m.cargoInterno || ''} ${extraerArray(m.roles).join(' ')}`.toLowerCase().includes(texto)
                  );

                  if (matchEmpresa) {
                      entidadesFiltradas.push(entidad);
                  } else if (miembrosMatch.length > 0) {
                      entidadesFiltradas.push({ ...entidad, miembros: miembrosMatch });
                  }
              } else {
                  entidadesFiltradas.push(entidad);
              }
          });
          pintarGridAgrupado(entidadesFiltradas);
      }
  }

  // RENDER 1: VISTA CORPORATIVA (Empresa > Socios)
  function pintarGridAgrupado(datos) {
      contenedorSocios.innerHTML = '';
      if (datos.length === 0) {
          contenedorSocios.innerHTML = '<p class="estado-carga" style="grid-column: 1/-1;">No hay socios registrados bajo estos filtros.</p>';
          return;
      }

      const fragment = document.createDocumentFragment();

      datos.forEach(entidad => {
          const card = document.createElement('article');
          card.className = 'card-entidad';
          
          const claseHeader = entidad.is_empresa ? 'is-socia' : 'is-fisica';
          const imagenHtml = entidad.is_empresa 
              ? `<img src="${entidad.logo}" class="entidad-logo" onerror="this.style.display='none'">`
              : `<img src="${entidad.foto}" class="entidad-avatar" onerror="this.src='https://via.placeholder.com/90/e2e8f0/64748b?text=👤'">`;

          const sectorHtml = entidad.sector ? `<span class="entidad-sector">${entidad.sector}</span>` : '';

          let htmlMiembros = '<div class="miembros-list">';
          entidad.miembros.forEach(m => {
              let badgesHTML = '';
              if (m.isAlumni) badgesHTML += `<span class="badge-rol badge-alumni">Alumni</span>`;
              extraerArray(m.roles).forEach(r => badgesHTML += `<span class="badge-rol">${r}</span>`);

              const mentorizados = extraerArray(m.proyectosMentorizados);
              const mentorizaHTML = mentorizados.length > 0 ? `<div style="font-size:0.75rem; color:#002b5c; font-weight:500; margin-top:6px;"><strong>Mentoriza a:</strong> ${mentorizados.join(', ')}</div>` : '';

              const htmlFotoPersona = (entidad.is_empresa && m.foto) ? `<img src="${m.foto}" class="miembro-foto" onerror="this.src='https://via.placeholder.com/60/e2e8f0/64748b?text=👤'">` : '';
              
              // Se añade el cargo interno a la vista corporativa si lo tiene
              const htmlCargoInterno = m.cargoInterno ? `<p style="font-size:0.8rem; color:#00B159; font-weight:600; margin:0 0 2px 0;">${m.cargoInterno}</p>` : '';
              const htmlCargo = m.cargo ? `<p class="miembro-cargo" style="margin:0 0 6px 0;">${m.cargo}</p>` : '';

              htmlMiembros += `
                  <div class="miembro-item">
                      ${htmlFotoPersona}
                      <div class="miembro-datos">
                          <h4 class="miembro-nombre">${m.nombre}</h4>
                          ${htmlCargoInterno}
                          ${htmlCargo}
                          ${badgesHTML ? `<div class="roles-container">${badgesHTML}</div>` : ''}
                          ${mentorizaHTML}
                          ${m.linkedin ? `<a href="${m.linkedin}" target="_blank" class="linkedin-link">LinkedIn ↗</a>` : ''}
                      </div>
                  </div>
              `;
          });
          htmlMiembros += '</div>';

          const footerHTML = entidad.web ? `<div class="card-footer"><a href="${entidad.web}" target="_blank" class="btn-web">Visitar web corporativa ↗</a></div>` : '';

          card.innerHTML = `
              <div class="card-header ${claseHeader}">
                  ${imagenHtml}
                  <div class="entidad-info">
                      <h3 class="entidad-nombre">${entidad.nombre}</h3>
                      ${sectorHtml}
                  </div>
              </div>
              ${htmlMiembros}
              ${footerHTML}
          `;
          fragment.appendChild(card);
      });
      contenedorSocios.appendChild(fragment);
  }

  // RENDER 2: VISTA INDIVIDUAL (Socio > Empresa secundario) - Activa en filtro por Rol
  function pintarGridPersonas(datosPersonas) {
      contenedorSocios.innerHTML = '';
      if (datosPersonas.length === 0) {
          contenedorSocios.innerHTML = '<p class="estado-carga" style="grid-column: 1/-1;">No hay directivos con ese rol específico.</p>';
          return;
      }

      const fragment = document.createDocumentFragment();

      datosPersonas.forEach(p => {
          const card = document.createElement('article');
          card.className = 'card-entidad';
          
          const imagenHtml = `<img src="${p.foto}" class="entidad-avatar" onerror="this.src='https://via.placeholder.com/90/e2e8f0/64748b?text=👤'">`;
          
          // El cargo interno de la asociación (Ej: Presidente, Vocal) toma el máximo protagonismo debajo del nombre
          const htmlCargoInterno = p.cargoInterno ? `<p style="font-size:0.9rem; color:#00B159; font-weight:700; margin:4px 0 0 0;">${p.cargoInterno}</p>` : '';
          
          // Maquetación de la caja de empresa incrustada
          let htmlEmpresa = '';
          if (p.empresaVinculada) {
              const htmlLogoEmpresa = p.empresaLogo ? `<img src="${p.empresaLogo}" style="width:40px; height:40px; object-fit:contain; border-radius:4px; border:1px solid #e2e8f0; background:white; flex-shrink:0;" onerror="this.style.display='none'">` : '';
              htmlEmpresa = `
                  <div style="display:flex; align-items:center; gap:10px; margin-top:15px; padding:10px; background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0;">
                      ${htmlLogoEmpresa}
                      <div style="text-align:left;">
                          <p style="font-size:0.85rem; font-weight:700; color:#002b5c; margin:0; line-height:1.2;">${p.empresaVinculada}</p>
                          ${p.cargo ? `<p style="font-size:0.75rem; color:#64748b; margin:2px 0 0 0; line-height:1.2;">${p.cargo}</p>` : ''}
                      </div>
                  </div>
              `;
          } else if (p.cargo) {
              // Por si es profesional independiente y no tiene empresa mapeada pero sí un cargo descriptivo
              htmlEmpresa = `<p style="font-size:0.85rem; color:#64748b; margin:10px 0 0 0;">${p.cargo}</p>`;
          }
          
          let badgesHTML = '';
          if (p.isAlumni) badgesHTML += `<span class="badge-rol badge-alumni">Alumni</span>`;
          extraerArray(p.roles).forEach(r => badgesHTML += `<span class="badge-rol">${r}</span>`);

          const mentorizados = extraerArray(p.proyectosMentorizados);
          const mentorizaHTML = mentorizados.length > 0 ? `<div style="font-size:0.75rem; color:#002b5c; font-weight:500; margin-top:8px;"><strong>Mentoriza a:</strong> ${mentorizados.join(', ')}</div>` : '';
          
          const htmlLinkedin = p.linkedin ? `<div style="margin-top:10px;"><a href="${p.linkedin}" target="_blank" class="linkedin-link">LinkedIn ↗</a></div>` : '';

          const footerHTML = p.empresaWeb ? `<div class="card-footer"><a href="${p.empresaWeb}" target="_blank" class="btn-web">Web de la empresa ↗</a></div>` : '';

          card.innerHTML = `
              <div class="card-header is-fisica" style="display:flex; flex-direction:column; text-align:center; padding-top:30px;">
                  ${imagenHtml}
                  <div class="entidad-info" style="width:100%;">
                      <h3 class="entidad-nombre" style="margin-top:10px;">${p.nombre}</h3>
                      ${htmlCargoInterno}
                      ${htmlEmpresa}
                  </div>
              </div>
              <div class="miembros-list">
                  ${badgesHTML ? `<div class="roles-container mb-2">${badgesHTML}</div>` : ''}
                  ${mentorizaHTML}
                  ${htmlLinkedin}
              </div>
              ${footerHTML}
          `;
          fragment.appendChild(card);
      });
      contenedorSocios.appendChild(fragment);
  }

  inputBuscador.addEventListener('input', renderizarInterfaces);
  selectSector.addEventListener('change', renderizarInterfaces);
  selectRol.addEventListener('change', renderizarInterfaces);

  cargarDatos();
</script>
